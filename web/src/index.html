<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tala X</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tala X says what can honestly be said about a photo: camera original or platform copy, place, time, edits."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="16x16" />
  </head>
  <body>
    <!-- nginx replaces the placeholder with a new nonce for every page load. -->
    <app-root ngCspNonce="__CSP_NONCE__"></app-root>
    <noscript>
      Tala X needs JavaScript. Without it, use the command-line tool: pip install talax.
      <br />
      Tala X a besoin de JavaScript. Sans lui, utilisez l'outil en ligne de commande : pip install
      talax.
    </noscript>
  </body>
</html>
