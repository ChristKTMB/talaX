<section class="analyzing" role="status" aria-live="polite">
  <div class="scan" aria-hidden="true">
    <span class="corner corner--tl"></span>
    <span class="corner corner--tr"></span>
    <span class="corner corner--bl"></span>
    <span class="corner corner--br"></span>
    <div class="grid">
      @for (cell of cells; track cell) {
        <span class="cell"></span>
      }
    </div>
  </div>
  <h1 class="title">{{ i18n.t('analyzing.title') }}</h1>
  <p class="wait">{{ i18n.t('analyzing.wait') }}</p>
  @if (session.file(); as file) {
    <p class="file">{{ file.name }} · {{ i18n.size(file.size) }}</p>
  }
  <p class="deleted">
    <app-icon name="trash" />
    <span>{{ i18n.t('analyzing.deleted') }}</span>
  </p>
</section>
