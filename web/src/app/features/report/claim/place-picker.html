@if (shown()) {
  <div class="picker">
    <div
      #map
      class="picker__canvas"
      role="application"
      [attr.aria-label]="i18n.t('picker.label')"
    ></div>
    @if (failed()) {
      <p class="picker__note" role="status">{{ i18n.t('map.failed') }}</p>
    }
    <div class="picker__foot">
      <span>{{ i18n.t('picker.help') }}</span>
      <button type="button" class="link" (click)="hide()">{{ i18n.t('map.hide') }}</button>
    </div>
  </div>
} @else {
  <div class="offer">
    <button type="button" class="offer__button" (click)="shown.set(true)">
      <app-icon name="map" [size]="18" [weight]="1.7" />
      {{ i18n.t('picker.show') }}
    </button>
    <p>{{ i18n.t('map.warning') }}</p>
  </div>
}
