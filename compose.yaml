# Local run of the web service: `docker compose up --build`, then
# http://127.0.0.1:8088 (port: TALAX_PORT)
#
# Both containers: read-only file system, no privileges, temporary files in
# memory only (tmpfs), so that no user file ever reaches a disk.

# Logs hold no file name, position or address, but they still must not fill
# the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build: .
    read_only: true
    # Uploads live here for the time of an analysis. Up to four at once, each
    # held twice (Starlette's copy and ours): 512 MB of RAM at most.
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      TMPDIR: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  # Serves the Angular front and passes /api on to the API.
  nginx:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Only the machine itself can reach this port: on the server, its own nginx
    # terminates HTTPS in front (deploy/host-nginx.conf, docs/deploy.md).
    ports:
      - "127.0.0.1:${TALAX_PORT:-8088}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging
