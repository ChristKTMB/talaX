# Local run of the web service: `docker compose up --build`, then
# http://127.0.0.1:8088/api/health (port: TALAX_PORT)
#
# Both containers: read-only file system, no privileges, temporary files in
# memory only (tmpfs), so that no user file ever reaches a disk.

services:
  api:
    build: .
    read_only: true
    # Uploads live here for the time of an analysis. Up to four at once, each
    # held twice (Starlette's copy and ours): 512 MB of RAM at most.
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      TMPDIR: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Local only. On the server, HTTPS in front comes with the deployment.
    ports:
      - "127.0.0.1:${TALAX_PORT:-8088}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
