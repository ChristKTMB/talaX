# nginx of the server (not the container): HTTPS in front of Tala X.
# Install as /etc/nginx/sites-available/talax.online, then run certbot, which
# adds the certificate lines (docs/deploy.md). Only this site is configured
# here: other sites of the server are left alone.
#
# The container's nginx does the rest (site, security policy, limits). This
# one must keep three promises of the privacy policy:
#   - no user file on disk: uploads and answers are streamed, never buffered
#     to a temporary file;
#   - no client address and no visited address in a log: access log off,
#     errors at "crit" only (their lines carry both);
#   - the visitor's address goes to the container's rate limits only.

server {
    listen 80;
    listen [::]:80;
    server_name talax.online www.talax.online;

    access_log off;
    error_log /var/log/nginx/talax.online.error.log crit;

    # No redirect here: certbot --redirect adds its own, and refuses to run
    # if another "if ($host = ...)" block is already present.

    # Slightly above the API's own 50 MB limit (the container checks it too).
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_buffering on;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:9188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrites whatever a visitor sent: the container trusts this header.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Referer goes through untouched: the tile relay needs it (OSM policy).
    }
}
