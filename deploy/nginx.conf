# nginx in front of the Tala X API, serving the Angular front too (image built
# by deploy/web.Dockerfile). Installed as /etc/nginx/conf.d/default.conf,
# inside the `http` block.
#
# Rules of the web service (project notes, section 15): no user file on disk,
# no content and no client address in the logs.

# Limits per client address, kept in memory only.
limit_req_zone $binary_remote_addr zone=analyze:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tiles:10m rate=20r/s;
limit_req_status 429;
# Rejections are logged at "info", below the level kept: their lines carry
# the client address.
limit_req_log_level info;

# nginx's error log writes the client address and the request line (map tile
# coordinates included) on every problem: only critical errors are kept.
# The API logs every request itself, without them.
error_log /dev/stderr crit;
access_log off;
server_tokens off;

# Error bodies in the API's format. Their texts live here, not in the message
# catalogues, because these errors never reach the API.
map $http_accept_language $limit_message {
    ~*^fr   '{"error":{"code":"rate_limited","message":"Trop d\'analyses en peu de temps. Réessayez dans une minute."}}';
    default '{"error":{"code":"rate_limited","message":"Too many analyses in a short time. Please try again in a minute."}}';
}
map $http_accept_language $too_large_message {
    ~*^fr   '{"error":{"code":"file_too_large","message":"Le fichier dépasse 50 Mo, la limite du service web. Pour un fichier plus lourd, utilisez l\'outil en ligne de commande."}}';
    default '{"error":{"code":"file_too_large","message":"The file is larger than 50 MB, the limit of the web service. For larger files, use the command-line tool."}}';
}

# Angular names its bundles after their content (main-3KX7Q2LA.js): they never
# change, so browsers may keep them. Other files (fonts, logo) for a day.
map $uri $static_cache {
    "~*-[a-z0-9]{8}\.(js|css)$" "public, max-age=31536000, immutable";
    default                    "public, max-age=86400";
}

upstream talax_api {
    server api:8000;
}

server {
    listen 8080;
    charset utf-8;

    # Slightly above the API's own 50 MB limit, so that the API answers with
    # its exact message; nginx only stops what is far beyond.
    client_max_body_size 51m;
    # Stream uploads to the API instead of writing them to nginx's disk.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    # Responses describe a user's file: never written to disk either.
    proxy_max_temp_file_size 0;
    proxy_buffers 16 64k;

    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    # The API never needs the client address: none is forwarded.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    error_page 429 = @rate_limited;
    error_page 413 = @too_large;

    location = /api/analyze {
        # 10 per minute; a burst of 5 lets the front send the same file
        # again with the sky the user saw.
        limit_req zone=analyze burst=5 nodelay;
        proxy_pass http://talax_api;
    }

    location /api/tiles/ {
        # A map view needs a few dozen tiles at once.
        limit_req zone=tiles burst=80 nodelay;
        # The Referer goes through untouched: the relay needs it (OSM policy).
        # No proxy_set_header here: one would drop those of the server block.
        proxy_pass http://talax_api;
    }

    location /api/ {
        proxy_pass http://talax_api;
    }

    # --- The Angular front (web/, built into the image) ---------------------
    root /usr/share/nginx/html;

    # The page itself: a new nonce on every load for the styles Angular adds,
    # so the policy never needs 'unsafe-inline'. Never cached, so the nonce
    # is never reused.
    location = /index.html {
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $request_id;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        # Not no-referrer: the tile relay passes our origin on to OpenStreetMap.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # Files of the build; every other address is a page of the front.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $static_cache always;
    }

    location @rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 $limit_message;
    }

    location @too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 $too_large_message;
    }
}
