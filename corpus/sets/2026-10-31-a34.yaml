# Truth sheet for corpus/files/2026-10-31-a34/
# File names: <route><shot>.<ext>, e.g. whatsapp-gallery3.jpeg = shot 3 sent
# through WhatsApp gallery. The route decides the expected verdict.

id: 2026-10-31-a34
device:
  make: samsung
  model: Galaxy A34 5G
  firmware: A346BXXSHFZJ4
  android: null          # not recorded
  camera_app: stock Samsung camera, default settings, no editing
captured_on: 2026-10-31
gps_in_originals: true   # coordinates are never written in this file

notes: >-
  Two original signatures coexist on this device with the same app and
  settings. Shots 1, 3, 7, 8: Software "MediaTek Camera Application", no
  OffsetTime, Flash written as "Off, Did not fire"/"On, Fired". Shots 2, 4,
  5, 6: Software = firmware version, OffsetTime +01:00, Flash written as
  "No Flash"/"Fired". Not explained by flash use. Both are originals.
  Shots 4 and 5 are 3408x2556 instead of 4000x3000. Indoor shots used flash.
  WhatsApp copies retrieved on the sender side, from the A34's own WhatsApp
  Web session.

routes:
  original:
    expected_integrity: original
    retrieval: usb-cable from DCIM/Camera
  whatsapp-document:
    expected_integrity: original
    expected_pipeline: null
    steps:
      - platform: whatsapp
        app_version: null
        send_mode: document
        retrieval: whatsapp-web-download
        date: 2026-10-31
    observed: >-
      Same size as the original. Only the GPS fields differ: position,
      altitude, GPS time and processing method zeroed in place (52 bytes).
      Probably Android location redaction for apps without
      ACCESS_MEDIA_LOCATION, not WhatsApp itself (unconfirmed).
  whatsapp-gallery:
    expected_integrity: reprocessed
    expected_pipeline: whatsapp-gallery
    steps:
      - platform: whatsapp
        app_version: null
        send_mode: gallery-standard
        retrieval: whatsapp-web-download
        date: 2026-10-31
    observed: >-
      EXIF fully removed, JFIF 1.01, progressive JPEG, 4:2:0, orientation
      applied to pixels. 750x1000 or 810x1080, about 30-90 KB.
  whatsapp-gallery-hd:
    excluded: >-
      Byte-identical to whatsapp-gallery for every shot: HD was not applied,
      or the standard copy was saved twice. Not usable until resent.

shots:   # indoor/outdoor inferred from ISO and exposure time, to confirm
  1: {location: indoor, flash: false}
  2: {location: indoor, flash: false}
  3: {location: indoor, flash: true}
  4: {location: indoor, flash: false}
  5: {location: indoor, flash: true}
  6: {location: outdoor, flash: false}
  7: {location: outdoor, flash: false}
  8: {location: outdoor, flash: false}

