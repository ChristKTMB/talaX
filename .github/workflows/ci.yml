name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}

      # ExifTool 13+ on every system (distribution packages are too old).
      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: |
          v=$(curl -fsS https://exiftool.org/ver.txt)
          curl -fsSL "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-$v.tar.gz/download" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Image-ExifTool-$v" >> "$GITHUB_PATH"
      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          v=$(curl -fsS https://exiftool.org/ver.txt)
          curl -fsSL -o exiftool.zip "https://sourceforge.net/projects/exiftool/files/exiftool-${v}_64.zip/download"
          unzip -q exiftool.zip -d "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/exiftool-${v}_64"
          mv "$dir/exiftool(-k).exe" "$dir/exiftool.exe"
          cygpath -w "$dir" >> "$GITHUB_PATH"
      - run: exiftool -ver

      - run: uv sync --locked --all-extras
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "import talax; print(talax.__version__)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS http://127.0.0.1:8088/api/health | grep -q '"exiftool"'
          head -c 2000 /dev/urandom > upload.jpg
          curl -fsS -F file=@upload.jpg http://127.0.0.1:8088/api/analyze | grep -q '"schema":2'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/nowhere)
          test "$code" = 404
      - name: No file left behind, no client address in the logs
        run: |
          test "$(docker compose exec -T api sh -c 'ls -A /tmp | wc -l')" = 0
          # Clients reach nginx from Docker's private ranges.
          ! docker compose logs | grep -E '\b(172\.(1[6-9]|2[0-9]|3[01])|192\.168|10)\.[0-9]+\.[0-9]+'
      - if: always()
        run: docker compose logs && docker compose down
