name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install ExifTool (latest; the Ubuntu package is too old)
        run: |
          version=$(curl -fsS https://exiftool.org/ver.txt)
          curl -fsSL "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-${version}.tar.gz/download" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Image-ExifTool-${version}" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
