name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}

      # ExifTool 13+ on every system (distribution packages are too old).
      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: |
          v=$(curl -fsS https://exiftool.org/ver.txt)
          curl -fsSL "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-$v.tar.gz/download" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Image-ExifTool-$v" >> "$GITHUB_PATH"
      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          v=$(curl -fsS https://exiftool.org/ver.txt)
          curl -fsSL -o exiftool.zip "https://sourceforge.net/projects/exiftool/files/exiftool-${v}_64.zip/download"
          unzip -q exiftool.zip -d "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/exiftool-${v}_64"
          mv "$dir/exiftool(-k).exe" "$dir/exiftool.exe"
          cygpath -w "$dir" >> "$GITHUB_PATH"
      - run: exiftool -ver

      - run: uv sync --locked --all-extras
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "import talax; print(talax.__version__)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach --wait
      - name: Smoke test through nginx
        run: |
          curl -fsS http://127.0.0.1:9188/api/health | grep -q '"exiftool"'
          head -c 2000 /dev/urandom > upload.jpg
          curl -fsS -F file=@upload.jpg http://127.0.0.1:9188/api/analyze | grep -q '"schema":2'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9188/api/nowhere)
          test "$code" = 404
      - name: The front is served with its security policy
        run: |
          curl -fsS -D headers.txt http://127.0.0.1:9188/terms -o page.html
          grep -q '<app-root' page.html
          # A fresh nonce replaced the placeholder, and the policy names it.
          ! grep -q '__CSP_NONCE__' page.html
          nonce=$(grep -oE 'ngcspnonce="[0-9a-f]{32}"' page.html | cut -d'"' -f2)
          grep -qi "content-security-policy: .*'nonce-$nonce'" headers.txt
          grep -qi 'referrer-policy: strict-origin-when-cross-origin' headers.txt
      - name: Search engines get the pages, the sitemap and real 404s
        run: |
          curl -fsS http://127.0.0.1:9188/fr/conditions | grep -q '<html lang="fr">'
          curl -fsS http://127.0.0.1:9188/robots.txt | grep -q '^Sitemap: https://talax.online/sitemap.xml'
          curl -fsS http://127.0.0.1:9188/sitemap.xml | grep -q 'hreflang="fr"'
          code=$(curl -s -o page.html -w '%{http_code}' http://127.0.0.1:9188/nowhere)
          test "$code" = 404
          grep -q 'noindex' page.html
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end tests in a real browser, through nginx
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Rate limits follow the visitor's address given by the server's nginx
        run: |
          head -c 2000 /dev/urandom > upload.jpg
          send() { curl -s -o /dev/null -w '%{http_code}\n' -H "X-Real-IP: $1" -F file=@upload.jpg http://127.0.0.1:9188/api/analyze; }
          # A burst of 5 is allowed: the 7th request of one visitor is refused...
          for i in 1 2 3 4 5 6; do send 203.0.113.1 > /dev/null; done
          test "$(send 203.0.113.1)" = 429
          # ...while another visitor is not.
          test "$(send 203.0.113.2)" = 200
          ! docker compose logs | grep -q '203\.0\.113'
      - name: No file left behind, no client address in the logs
        run: |
          test "$(docker compose exec -T api sh -c 'ls -A /tmp | wc -l')" = 0
          # Clients reach nginx from Docker's private ranges.
          ! docker compose logs | grep -E '\b(172\.(1[6-9]|2[0-9]|3[01])|192\.168|10)\.[0-9]+\.[0-9]+'
      - if: always()
        run: docker compose logs && docker compose down
