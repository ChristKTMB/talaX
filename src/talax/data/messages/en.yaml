source.title: Ask for the original
source.intro: 'The original file holds what this copy has lost or may have changed. A message
  ready to send to your source:'
source.message: |-
  Hello, and thank you for the photo. Before publishing it I need to check it, and for that I need the original file, exactly as it is on the device that took it. Could you send it again this way?

  - WhatsApp: tap the paperclip, then "Document" (not "Gallery" or "Photos"), and pick the photo.
  - Telegram: tap the paperclip, then "File", and pick the photo.
  - Or as an e-mail attachment, at its actual size if you are asked.

  Please do not crop or edit it before sending.

  The original file may show where the photo was taken and which phone took it. If that puts you at risk, tell me before sending it.
source.caution: 'Ask for it only if your source can send it safely: the original can reveal
  their position and their phone''s serial number. Analyse it with the Tala X command line,
  so the file never leaves your computer. On Android, the position can be removed even when
  the file is sent as a document (seen on a Samsung phone); the other marks of the original
  remain.'
reverse.title: Has this photo been seen before?
reverse.intro: 'A real photo with a false caption is more common than a doctored one, and no
  analysis of the file can catch it. Upload the photo yourself to one of these services, look
  for the oldest copy and compare its date and place with the caption. If nothing comes up,
  try again with a crop of the most distinctive part.'
reverse.caution: 'Tala X sends them nothing: you upload the photo yourself, and these services
  receive it and may keep it. Do not do it with a photo that must stay confidential.'
declaration.summary: '{place} {time}'
declaration.nothing: 'The file records neither a position nor a capture time to compare with
  the declared place and time. The solar check uses the declaration.'
declaration.place.none: The file records no position to compare with the declared place.
declaration.place.close: The declared place is {km:.0f} km from the position recorded in the file.
declaration.place.near: 'The declared place is {km:.0f} km from the position recorded in the
  file, more than the usual accuracy of a phone. The recorded position may be an old one, or
  the caption imprecise.'
declaration.place.far: 'The declared place is {km:.0f} km from the position recorded in the
  file. A recorded position this far off is hard to explain other than by a photo taken
  somewhere else than the caption says.'
declaration.time.none: The file records no capture time to compare with the declared time.
declaration.time.close: The time recorded in the file is {gap} away from the declared time.
declaration.time.before: 'The file records {when}, {gap} before the declared time. A wrongly
  set clock can explain it; so can an older photo reused with a new caption.'
declaration.time.after: 'The file records {when}, {gap} after the declared time. A wrongly
  set clock can explain it; so can a caption that dates the photo wrongly.'
