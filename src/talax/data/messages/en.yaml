weather.summary_no_cloud: 'Weather model near {lat}, {lon}, from {start} to {end} UTC: {rain:.1f} mm
  of precipitation, {snow:.1f} cm of snow; cloud cover unknown.'
weather.no_observation: '{summary} Say what the photo shows to compare. These are model values
  over cells of 9 to 25 km, not station readings: a local shower can escape them.'
weather.consistent: '{summary} The photo shows {seen}: this agrees. These are model values over
  cells of 9 to 25 km, not station readings.'
weather.to_check: '{summary} The photo shows {seen}, but {reason}. A local shower or passing
  clouds can explain it, since these are model values over cells of 9 to 25 km: compare with
  other sources (local stations, other photos of the same day).'
weather.reason.no_rain: the model records no precipitation
weather.reason.no_snow: the model records no snowfall
weather.reason.clear_sky: the model gives an almost clear sky
weather.reason.raining: the model records rain
weather.reason.covered: the model gives an almost fully covered sky
