conditions.snow: snow falling
conditions.overcast: an overcast sky
conditions.clear: a clear sky or sharp shadows
weather.missing_input: 'The weather was not looked up: it needs both the place and the time of
  the photo. Enter the place and time the caption claims.'
weather.unavailable: 'The weather service did not answer. Nothing can be said about the weather;
  the rest of the analysis is not affected.'
weather.no_data: 'The weather service has no data for this place and time (a date in the
  future?). Nothing can be said about the weather.'
