[project]
name = "talax"
version = "0.2.0"
description = "Honest image verification: original camera file or platform copy?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "ChristKTMB" }]
keywords = [
    "image-forensics",
    "fact-checking",
    "journalism",
    "osint",
    "exif",
    "metadata",
    "c2pa",
    "verification",
]
dependencies = [
    "astral>=3.2",
    # 0.38.1 and 0.38.2 were not published for every platform.
    "c2pa-python==0.38.0",
    "jinja2>=3.1",
    "pillow>=12",
    "pyyaml>=6.0",
    "timezonefinder>=9.2",
    "typer>=0.15",
    "tzdata>=2025.1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.scripts]
talax = "talax.cli:app"

[project.urls]
Homepage = "https://github.com/ChristKTMB/talaX"
Repository = "https://github.com/ChristKTMB/talaX"
Issues = "https://github.com/ChristKTMB/talaX/issues"
"Français" = "https://github.com/ChristKTMB/talaX/blob/main/README.fr.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["code_extern_*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["c2pa", "c2pa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
